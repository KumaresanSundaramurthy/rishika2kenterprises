server {
    listen 10000;
    server_name r2k-web-service.onrender.com;

    client_max_body_size 50M;

    root /var/www/html;
    index index.php index.html index.htm;

    # Ping endpoint — no PHP overhead, pure nginx response
    location = /ping/check {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        return 200 '{"status":"ok"}';
    }

    # Static assets under /app/* — strip /app/ prefix and serve directly
    location ~* ^/app/(.+\.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|otf|svg|map|html|txt|wasm|pdf))$ {
        try_files /$1 =404;
    }

    # All /app/ routes — SCRIPT_NAME set to /app/index.php so CI3 strips the prefix before routing
    location /app/ {
        try_files $uri @ci3_app;
    }

    location @ci3_app {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME     /app/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html;
        fastcgi_read_timeout    120;
        fastcgi_connect_timeout  10;
        fastcgi_send_timeout    120;
    }

    # Root — public website pages (landing, login, signup etc.)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_read_timeout    120;
        fastcgi_connect_timeout  10;
        fastcgi_send_timeout    120;
    }

    location ~ /\.ht {
        deny all;
    }
}
